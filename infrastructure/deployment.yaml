apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-container
          image: myregistry.localhost:5000/flask-migration-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          volumeMounts:
            - mountPath: /data
              name: flask-storage
      volumes:
        - name: flask-storage
          persistentVolumeClaim:
            claimName: flask-data-pvc
